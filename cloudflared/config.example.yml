# Copy to cloudflared/config.yml and fill in your tunnel UUID + credentials path.
# Credentials are created by: cloudflared tunnel create receiptbrain
#
#   cp cloudflared/config.example.yml cloudflared/config.yml
#   # Edit tunnel id + credentials-file path, then:
#   pnpm run tunnel

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /Users/YOU/.cloudflared/REPLACE_WITH_TUNNEL_UUID.json

ingress:
  # Public HTTPS → local Next.js (only this port is exposed)
  - hostname: receiptbrain.richolaniyan.com
    service: http://localhost:3000
  - service: http_status:404
